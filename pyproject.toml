[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "morphostack"
version = "1.0.0"
description = "Local morphometry toolkit for microscopy Z-stacks."
readme = "README.md"
requires-python = ">=3.11"
# Dual public license: choose AGPL-3.0-only OR PolyForm Noncommercial 1.0.0.
# Commercial closed-source use requires a separate license from the author.
license = "AGPL-3.0-only OR PolyForm-Noncommercial-1.0.0"
license-files = [
  "LICENSE",
  "LICENSE-AGPL-3.0.txt",
  "LICENSE-POLYFORM-NONCOMMERCIAL-1.0.0.txt",
]
authors = [
  { name = "Abhinav", email = "ms24115@iisermohali.ac.in" }
]
dependencies = [
  "numpy",
  "psutil",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
api = [
  "fastapi",
  "httpx",
  "python-multipart",
  "uvicorn",
]
analysis = [
  "opencv-python",
  "scikit-image",
  "scipy",
  "pandas",
  "tifffile",
  "czifile",
  "shapely",
  "plotly",
  "networkx",
  "pillow",
]
all = [
  "fastapi",
  "httpx",
  "python-multipart",
  "uvicorn",
  "opencv-python",
  "scikit-image",
  "scipy",
  "pandas",
  "tifffile",
  "czifile",
  "shapely",
  "plotly",
  "networkx",
  "pillow",
  "pytest",
]

[project.scripts]
morphostack = "morphostack.cli:main"
mst = "morphostack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/morphostack"]

[tool.hatch.build.targets.wheel.force-include]
"apps/web/dist" = "morphostack/_web_static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: integration tests that load large real microscopy files",
]
